<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#f7f5f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>📓 Ежедневник</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f7f5f0;
            font-family: -apple-system, 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 1rem 0.8rem;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 3rem;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            padding: 1.5rem 1.2rem 2rem;
        }
        h1 {
            font-weight: 600;
            font-size: 1.6rem;
            color: #1e1e2a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 2px solid #eae6df;
            padding-bottom: 0.7rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 0.8rem;
            font-weight: 400;
            color: #7b7b8b;
            margin-left: auto;
            background: #f0ede8;
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
        }
        .day-section {
            background: #fcfbf9;
            border-radius: 1.5rem;
            padding: 1.2rem 1rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #ece8e2;
        }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .day-header h2 {
            font-weight: 500;
            font-size: 1.1rem;
            color: #2c2c3a;
        }
        .date-badge {
            font-size: 0.7rem;
            background: #eae6df;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            color: #3e3e4e;
        }
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .check-item {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        .check-item label {
            font-weight: 500;
            font-size: 0.8rem;
            color: #3f3f4b;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .check-item label span {
            background: #edeae4;
            border-radius: 30px;
            padding: 0.05rem 0.5rem;
            font-size: 0.65rem;
            color: #4e4e5e;
        }
        .check-item input, .check-item textarea {
            width: 100%;
            padding: 0.6rem 0.9rem;
            border: 1px solid #ddd8d0;
            border-radius: 1.5rem;
            font-size: 0.9rem;
            background: white;
            font-family: inherit;
            resize: vertical;
            -webkit-appearance: none;
            appearance: none;
        }
        .check-item input:focus, .check-item textarea:focus {
            outline: 2px solid #b7ada0;
            border-color: transparent;
            background: #fefefd;
        }
        .check-item textarea {
            min-height: 2.8rem;
            border-radius: 1.2rem;
            line-height: 1.4;
        }
        .energy-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .energy-row input {
            flex: 1;
            min-width: 80px;
        }
        .energy-label {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            background: #f0ede7;
            padding: 0.2rem 0.7rem 0.2rem 0.8rem;
            border-radius: 40px;
            font-size: 0.7rem;
            color: #3e3e4e;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-top: 0.7rem;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn {
            border: none;
            background: transparent;
            padding: 0.4rem 1rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            color: #3a3a48;
            background: #eeebe6;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            touch-action: manipulation;
        }
        .btn-primary {
            background: #2c2c3a;
            color: white;
        }
        .btn-primary:active { background: #1e1e2a; transform: scale(0.97); }
        .btn-outline {
            background: transparent;
            border: 1px solid #d5cec4;
        }
        .btn-outline:active { background: #f0ede8; }
        .btn-success {
            background: #2d5a2d;
            color: white;
        }
        .btn-success:active { background: #1e4a1e; transform: scale(0.97); }
        .status-message {
            font-size: 0.7rem;
            color: #2d5a2d;
            background: #e6f0e6;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
        }
        .status-message.show { opacity: 1; }
        .history-section {
            margin-top: 1.5rem;
            border-top: 2px solid #eae6df;
            padding-top: 1rem;
        }
        .history-section h3 {
            font-weight: 500;
            font-size: 0.95rem;
            color: #3f3f4e;
            margin-bottom: 0.6rem;
            display: flex;
            gap: 0.4rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .history-toolbar {
            display: flex;
            gap: 0.4rem;
            margin-left: auto;
            flex-wrap: wrap;
        }
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 0.2rem;
            -webkit-overflow-scrolling: touch;
        }
        .history-item {
            background: #f6f4f0;
            border-radius: 1.2rem;
            padding: 0.5rem 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            border-left: 4px solid #d0c9bf;
            font-size: 0.75rem;
        }
        .history-item .h-date {
            font-weight: 500;
            color: #1e1e2a;
            min-width: 70px;
            font-size: 0.7rem;
        }
        .history-item .h-task {
            flex: 2;
            min-width: 80px;
            color: #2e2e3e;
            font-size: 0.75rem;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
        .history-item .h-energy {
            background: #e3dfd8;
            padding: 0.05rem 0.5rem;
            border-radius: 40px;
            font-size: 0.65rem;
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
        }
        .history-item .h-reflection {
            color: #4d4d5e;
            font-style: italic;
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.7rem;
        }
        .empty-history {
            color: #a09e96;
            font-size: 0.8rem;
            padding: 0.5rem 0;
        }
        .btn-small {
            font-size: 0.6rem;
            padding: 0.15rem 0.6rem;
            background: #e1dcd4;
        }
        .storage-info {
            font-size: 0.6rem;
            color: #9a9aa8;
            text-align: center;
            margin-top: 0.8rem;
            border-top: 1px solid #eae6df;
            padding-top: 0.8rem;
        }
        .storage-banner {
            background: #e8f0e8;
            border-radius: 1rem;
            padding: 0.5rem 1rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.6rem;
            font-size: 0.75rem;
            color: #1e3a1e;
            border: 1px solid #b8d0b8;
            flex-wrap: wrap;
        }
        .storage-banner .btn {
            background: #2d5a2d;
            color: white;
            padding: 0.2rem 0.8rem;
            font-size: 0.7rem;
        }
        .storage-banner .btn:active { transform: scale(0.97); }
        .storage-banner .badge {
            background: #d4e8d4;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-size: 0.6rem;
        }
        .install-banner {
            background: #e8e4dc;
            border-radius: 1.5rem;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            display: none;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.8rem;
            color: #2c2c3a;
            border: 1px solid #d5cec4;
        }
        .install-banner.show { display: flex; }
        .offline-badge {
            display: inline-block;
            background: #f0d8d8;
            color: #6a2a2a;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            font-size: 0.6rem;
            margin-left: 0.5rem;
        }
        @media (max-width: 480px) {
            .container { padding: 1rem 0.8rem; }
            .day-section { padding: 0.8rem; }
            .history-item .h-reflection { max-width: 80px; }
            .storage-banner { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>
        📓 Ежедневник
        <small>PWA <span class="offline-badge" id="offlineBadge">● онлайн</span></small>
    </h1>

    <!-- Баннер статуса хранилища -->
    <div class="storage-banner" id="storageBanner">
        <span>
            💾 Хранилище: <span id="storageStatus">проверка...</span>
            <span class="badge" id="storageSize">0 МБ</span>
        </span>
        <button class="btn" id="requestPersistBtn">🔒 Включить надёжное сохранение</button>
    </div>

    <div class="day-section">
        <div class="day-header">
            <h2>🗓️ Сегодня</h2>
            <span class="date-badge" id="currentDateDisplay"></span>
        </div>

        <div class="checklist">
            <div class="check-item">
                <label><span>❶</span> Главная задача</label>
                <input type="text" id="mainTask" placeholder="Что самое важное?" />
            </div>
            <div class="check-item">
                <label><span>❷</span> Энергия утром</label>
                <div class="energy-row">
                    <input type="number" id="morningEnergy" placeholder="1–10" min="1" max="10" step="1" />
                    <span class="energy-label"><span>⚡</span> уровень</span>
                </div>
            </div>
            <div class="check-item">
                <label><span>❸</span> Рефлексия вечером</label>
                <textarea id="eveningReflection" rows="2" placeholder="Что удалось? Что чувствую?"></textarea>
            </div>
        </div>

        <div class="action-bar">
            <button class="btn btn-outline" id="resetDayBtn">↺ Сбросить</button>
            <button class="btn btn-primary" id="saveDayBtn">💾 Сохранить</button>
            <span id="saveStatus" class="status-message">✓ сохранено</span>
        </div>
    </div>

    <div class="history-section">
        <h3>
            📚 История записей
            <span class="history-toolbar">
                <button class="btn btn-small" id="exportBtn">⬇ Экспорт</button>
                <button class="btn btn-small" id="importBtn">⬆ Импорт</button>
                <input type="file" id="fileInput" style="display:none" accept=".json" />
            </span>
        </h3>
        <div id="historyContainer">
            <div class="history-list" id="historyList">
                <div class="empty-history">Загрузка...</div>
            </div>
        </div>
    </div>

    <!-- Баннер для установки PWA -->
    <div class="install-banner" id="installBanner">
        <span>📲 Установите приложение</span>
        <button class="btn btn-primary" id="installBtn">Установить</button>
    </div>

    <div class="storage-info">
        ✦ Данные хранятся в IndexedDB с запросом постоянного хранения ✦ Работает офлайн
    </div>
</div>

<script>
    (function() {
        "use strict";

        // --- DOM ---
        const mainTaskInput = document.getElementById('mainTask');
        const morningEnergyInput = document.getElementById('morningEnergy');
        const eveningReflectionInput = document.getElementById('eveningReflection');
        const saveBtn = document.getElementById('saveDayBtn');
        const resetBtn = document.getElementById('resetDayBtn');
        const statusMsg = document.getElementById('saveStatus');
        const dateDisplay = document.getElementById('currentDateDisplay');
        const historyList = document.getElementById('historyList');
        const storageStatus = document.getElementById('storageStatus');
        const storageSize = document.getElementById('storageSize');
        const requestPersistBtn = document.getElementById('requestPersistBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('fileInput');
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const offlineBadge = document.getElementById('offlineBadge');

        // --- Отслеживание статуса онлайн/офлайн ---
        function updateOnlineStatus() {
            if (navigator.onLine) {
                offlineBadge.textContent = '● онлайн';
                offlineBadge.style.background = '#d4e8d4';
                offlineBadge.style.color = '#1e4a1e';
            } else {
                offlineBadge.textContent = '● офлайн';
                offlineBadge.style.background = '#f0d8d8';
                offlineBadge.style.color = '#6a2a2a';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // --- Конфигурация IndexedDB ---
        const DB_NAME = 'DailyJournalDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'entries';

        let db = null;
        let isInitialized = false;

        // --- Инициализация IndexedDB ---
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        const store = database.createObjectStore(STORE_NAME, { keyPath: 'date' });
                        store.createIndex('date', 'date', { unique: true });
                        console.log('✅ ObjectStore создан');
                    }
                };

                request.onsuccess = (event) => {
                    db = event.target.result;
                    console.log('✅ IndexedDB открыта');
                    resolve(db);
                };

                request.onerror = (event) => {
                    console.error('❌ Ошибка открытия DB:', event.target.error);
                    reject(event.target.error);
                };
            });
        }

        // --- CRUD операции ---

        function getAllEntries() {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('База данных не инициализирована'));
                    return;
                }
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => {
                    const entries = {};
                    request.result.forEach(item => {
                        entries[item.date] = {
                            mainTask: item.mainTask || '',
                            morningEnergy: item.morningEnergy || '',
                            eveningReflection: item.eveningReflection || ''
                        };
                    });
                    resolve(entries);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        function getEntry(dateKey) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('База данных не инициализирована'));
                    return;
                }
                const transaction = db.transaction(STORE_NAME, 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.get(dateKey);

                request.onsuccess = () => {
                    resolve(request.result || null);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        function saveEntry(dateKey, data) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('База данных не инициализирована'));
                    return;
                }
                const entry = {
                    date: dateKey,
                    mainTask: data.mainTask || '',
                    morningEnergy: data.morningEnergy || '',
                    eveningReflection: data.eveningReflection || ''
                };
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.put(entry);

                request.onsuccess = () => {
                    resolve(entry);
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        function deleteEntry(dateKey) {
            return new Promise((resolve, reject) => {
                if (!db) {
                    reject(new Error('База данных не инициализирована'));
                    return;
                }
                const transaction = db.transaction(STORE_NAME, 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(dateKey);

                request.onsuccess = () => {
                    resolve();
                };

                request.onerror = () => {
                    reject(request.error);
                };
            });
        }

        function replaceAllEntries(entriesObj) {
            return new Promise(async (resolve, reject) => {
                if (!db) {
                    reject(new Error('База данных не инициализирована'));
                    return;
                }
                try {
                    const clearTransaction = db.transaction(STORE_NAME, 'readwrite');
                    const clearStore = clearTransaction.objectStore(STORE_NAME);
                    await new Promise((resolveClear, rejectClear) => {
                        const request = clearStore.clear();
                        request.onsuccess = () => resolveClear();
                        request.onerror = () => rejectClear(request.error);
                    });

                    const entries = Object.entries(entriesObj);
                    for (const [dateKey, data] of entries) {
                        await saveEntry(dateKey, data);
                    }
                    resolve();
                } catch (err) {
                    reject(err);
                }
            });
        }

        // --- Проверка статуса хранилища ---
        async function updateStorageStatus() {
            try {
                if (navigator.storage && navigator.storage.estimate) {
                    const estimate = await navigator.storage.estimate();
                    const usedMB = (estimate.usage / 1024 / 1024).toFixed(2);
                    const quotaMB = (estimate.quota / 1024 / 1024).toFixed(2);
                    storageSize.textContent = `${usedMB} / ${quotaMB} МБ`;
                }

                if (navigator.storage && navigator.storage.persisted) {
                    const isPersisted = await navigator.storage.persisted();
                    storageStatus.textContent = isPersisted ? '✅ Постоянное' : '⚠️ Обычное (может быть очищено)';
                    if (isPersisted) {
                        requestPersistBtn.style.display = 'none';
                    } else {
                        requestPersistBtn.style.display = 'inline-block';
                    }
                } else {
                    storageStatus.textContent = '❌ Не поддерживается';
                }
            } catch (err) {
                console.warn('Ошибка получения статуса хранилища:', err);
                storageStatus.textContent = '⚠️ Неизвестно';
            }
        }

        // --- Запрос постоянного хранилища ---
        async function requestPersistentStorage() {
            if (!navigator.storage || !navigator.storage.persist) {
                alert('Ваш браузер не поддерживает запрос постоянного хранилища.');
                return;
            }

            const isPersisted = await navigator.storage.persisted();
            if (isPersisted) {
                statusMsg.textContent = '✅ Уже включено';
                statusMsg.classList.add('show');
                setTimeout(() => statusMsg.classList.remove('show'), 2000);
                updateStorageStatus();
                return;
            }

            const granted = await navigator.storage.persist();
            if (granted) {
                statusMsg.textContent = '✅ Постоянное хранилище включено!';
                statusMsg.classList.add('show');
                setTimeout(() => statusMsg.classList.remove('show'), 3000);
                updateStorageStatus();
            } else {
                alert('⚠️ Пользователь отклонил запрос. Данные могут быть удалены при нехватке места.');
                statusMsg.textContent = '⚠️ Отклонено';
                statusMsg.classList.add('show');
                setTimeout(() => statusMsg.classList.remove('show'), 3000);
            }
        }

        // --- helpers ---
        function getTodayKey() {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function getTodayDisplay() {
            const d = new Date();
            return `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
        }

        // --- отображение истории ---
        async function renderHistory() {
            try {
                const entries = await getAllEntries();
                const sortedDates = Object.keys(entries).sort((a, b) => b.localeCompare(a));

                if (sortedDates.length === 0) {
                    historyList.innerHTML = `<div class="empty-history">Нет записей. Создайте первую.</div>`;
                    return;
                }

                let html = '';
                const todayKey = getTodayKey();
                const limited = sortedDates.slice(0, 31);
                for (const dateKey of limited) {
                    const data = entries[dateKey];
                    if (!data) continue;
                    const parts = dateKey.split('-');
                    const displayDate = `${parts[2]}.${parts[1]}`;
                    const isToday = (dateKey === todayKey);
                    const task = data.mainTask || '—';
                    const energy = data.morningEnergy || '—';
                    const reflection = data.eveningReflection || '';
                    const refShort = reflection.length > 30 ? reflection.slice(0, 28) + '…' : reflection;

                    html += `
                        <div class="history-item" style="${isToday ? 'border-left-color: #6b7a6b; background: #f0f3ed;' : ''}">
                            <span class="h-date">${displayDate} ${isToday ? '⭐' : ''}</span>
                            <span class="h-task">${task}</span>
                            <span class="h-energy">⚡ ${energy}</span>
                            <span class="h-reflection">${refShort || '—'}</span>
                            <button class="btn btn-small" data-date="${dateKey}" data-action="delete">✕</button>
                        </div>
                    `;
                }
                historyList.innerHTML = html;

                document.querySelectorAll('[data-action="delete"]').forEach(btn => {
                    btn.addEventListener('click', async function(e) {
                        const dateKey = this.dataset.date;
                        if (confirm(`Удалить запись за ${dateKey}?`)) {
                            await deleteEntry(dateKey);
                            if (dateKey === getTodayKey()) clearFields();
                            await renderHistory();
                            statusMsg.textContent = '🗑️ удалено';
                            statusMsg.classList.add('show');
                            setTimeout(() => {
                                statusMsg.classList.remove('show');
                                statusMsg.textContent = '✓ сохранено';
                            }, 1500);
                        }
                    });
                });
            } catch (err) {
                console.error('Ошибка рендеринга истории:', err);
                historyList.innerHTML = `<div class="empty-history">Ошибка загрузки данных</div>`;
            }
        }

        // --- загрузка текущего дня ---
        async function loadToday() {
            try {
                const todayKey = getTodayKey();
                const data = await getEntry(todayKey);
                if (data) {
                    mainTaskInput.value = data.mainTask || '';
                    morningEnergyInput.value = data.morningEnergy || '';
                    eveningReflectionInput.value = data.eveningReflection || '';
                } else {
                    clearFields();
                }
            } catch (err) {
                console.error('Ошибка загрузки сегодняшнего дня:', err);
            }
        }

        function clearFields() {
            mainTaskInput.value = '';
            morningEnergyInput.value = '';
            eveningReflectionInput.value = '';
        }

        // --- сохранить текущий день ---
        async function saveToday(showStatus = true) {
            try {
                const todayKey = getTodayKey();
                const data = {
                    mainTask: mainTaskInput.value.trim(),
                    morningEnergy: morningEnergyInput.value.trim(),
                    eveningReflection: eveningReflectionInput.value.trim(),
                };
                await saveEntry(todayKey, data);
                await renderHistory();
                if (showStatus) {
                    statusMsg.textContent = '✓ сохранено';
                    statusMsg.classList.add('show');
                    setTimeout(() => {
                        statusMsg.classList.remove('show');
                    }, 1200);
                }
            } catch (err) {
                console.error('Ошибка сохранения:', err);
                alert('Ошибка сохранения: ' + err.message);
            }
        }

        // --- сброс ---
        async function resetToday() {
            const todayKey = getTodayKey();
            if (confirm('Сбросить все поля сегодняшнего дня? Данные будут удалены.')) {
                try {
                    await deleteEntry(todayKey);
                    clearFields();
                    await renderHistory();
                    statusMsg.textContent = '↺ сброшено';
                    statusMsg.classList.add('show');
                    setTimeout(() => {
                        statusMsg.classList.remove('show');
                        statusMsg.textContent = '✓ сохранено';
                    }, 1500);
                } catch (err) {
                    alert('Ошибка сброса: ' + err.message);
                }
            }
        }

        // --- ЭКСПОРТ ---
        async function exportData() {
            try {
                const entries = await getAllEntries();
                const sortedDates = Object.keys(entries).sort();
                if (sortedDates.length === 0) {
                    alert('Нет записей для экспорта.');
                    return;
                }
                const dataStr = JSON.stringify(entries, null, 2);
                const blob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.download = `daily_journal_${getTodayKey()}.json`;
                link.href = url;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                statusMsg.textContent = '⬇ экспорт готов';
                statusMsg.classList.add('show');
                setTimeout(() => statusMsg.classList.remove('show'), 2000);
            } catch (err) {
                alert('Ошибка экспорта: ' + err.message);
            }
        }

        // --- ИМПОРТ ---
        async function importFile(file) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (typeof imported === 'object' && imported !== null) {
                        const keys = Object.keys(imported);
                        if (keys.length > 0 && keys.every(k => /^\d{4}-\d{2}-\d{2}$/.test(k))) {
                            if (confirm(`Найдено ${keys.length} записей. Заменить все текущие данные?`)) {
                                await replaceAllEntries(imported);
                                await loadToday();
                                await renderHistory();
                                statusMsg.textContent = '✅ импорт выполнен';
                                statusMsg.classList.add('show');
                                setTimeout(() => {
                                    statusMsg.classList.remove('show');
                                    statusMsg.textContent = '✓ сохранено';
                                }, 2000);
                            }
                        } else {
                            alert('Файл не содержит корректных данных (ожидается объект с ключами вида ГГГГ-ММ-ДД).');
                        }
                    } else {
                        alert('Неверный формат файла.');
                    }
                } catch (err) {
                    alert('Ошибка при чтении файла: ' + err.message);
                }
            };
            reader.readAsText(file);
        }

        // --- PWA Установка ---
        let deferredPrompt = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.add('show');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    installBanner.classList.remove('show');
                    statusMsg.textContent = '✅ Приложение установлено!';
                    statusMsg.classList.add('show');
                    setTimeout(() => statusMsg.classList.remove('show'), 3000);
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('appinstalled', () => {
            installBanner.classList.remove('show');
        });

        // --- ИНИЦИАЛИЗАЦИЯ ---
        async function init() {
            try {
                await openDB();
                isInitialized = true;

                await updateStorageStatus();

                dateDisplay.textContent = getTodayDisplay();
                await loadToday();
                await renderHistory();

                // Проверяем, зарегистрирован ли Service Worker
                if ('serviceWorker' in navigator) {
                    try {
                        const registration = await navigator.serviceWorker.register('sw.js');
                        console.log('✅ Service Worker зарегистрирован');
                    } catch (err) {
                        console.warn('⚠️ Service Worker не зарегистрирован:', err);
                    }
                }

                statusMsg.textContent = '✅ готово';
                statusMsg.classList.add('show');
                setTimeout(() => statusMsg.classList.remove('show'), 1500);

            } catch (err) {
                console.error('Ошибка инициализации:', err);
                historyList.innerHTML = `<div class="empty-history">❌ Ошибка инициализации: ${err.message}</div>`;
            }
        }

        // --- обработчики событий ---
        saveBtn.addEventListener('click', (e) => {
            e.preventDefault();
            saveToday(true);
        });

        resetBtn.addEventListener('click', (e) => {
            e.preventDefault();
            resetToday();
        });

        requestPersistBtn.addEventListener('click', requestPersistentStorage);

        exportBtn.addEventListener('click', exportData);

        importBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', function(e) {
            if (this.files && this.files.length > 0) {
                importFile(this.files[0]);
                this.value = '';
            }
        });

        // --- автосохранение ---
        let saveTimer = null;
        async function onFieldChange() {
            clearTimeout(saveTimer);
            if (!isInitialized) return;

            const todayKey = getTodayKey();
            const data = {
                mainTask: mainTaskInput.value.trim(),
                morningEnergy: morningEnergyInput.value.trim(),
                eveningReflection: eveningReflectionInput.value.trim(),
            };

            try {
                await saveEntry(todayKey, data);
                await renderHistory();
                saveTimer = setTimeout(() => {
                    statusMsg.textContent = '✓ сохранено';
                    statusMsg.classList.add('show');
                    setTimeout(() => {
                        statusMsg.classList.remove('show');
                    }, 800);
                }, 400);
            } catch (err) {
                console.warn('Ошибка автосохранения:', err);
            }
        }

        [mainTaskInput, morningEnergyInput, eveningReflectionInput].forEach(field => {
            field.addEventListener('input', onFieldChange);
            field.addEventListener('blur', () => {
                clearTimeout(saveTimer);
                if (isInitialized) saveToday(true);
            });
        });

        mainTaskInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveToday(true);
            }
        });
        morningEnergyInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveToday(true);
            }
        });

        document.querySelectorAll('input, textarea').forEach(el => {
            el.addEventListener('focus', () => {
                statusMsg.classList.remove('show');
            });
        });

        // --- ЗАПУСК ---
        init();

        // Обновляем статус хранилища каждые 30 секунд
        setInterval(updateStorageStatus, 30000);

        // Регистрация Service Worker при загрузке
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(() => console.log('✅ SW зарегистрирован'))
                    .catch(err => console.warn('⚠️ SW не зарегистрирован:', err));
            });
        }

    })();
</script>

</body>
</html>
